:root{--bg:#EEF1F4;--surface:#fff;--ink:#141B26;--muted:#5A6577;--line:#DCE1E8;--accent:#1E5BD8}

a:hover{border-color:var(--accent)}
a b{display:block;font-family:'Bai Jamjuree','IBM Plex Sans Thai',sans-serif;font-size:18px;color:var(--accent)}
