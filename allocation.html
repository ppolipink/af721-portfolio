<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AF721 Allocation 5 พอร์ต</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: slim input bar, then 5 portfolio rows stacked to fit one screen for a screenshot */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#141B26; --muted:#5A6577; --line:#DCE1E8;
  --accent:#1E5BD8; --accent-soft:#E6EEFC; --good:#1A8F58;
  --display:'Bai Jamjuree','IBM Plex Sans Thai',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D121A; --surface:#161D29; --ink:#E6EBF2; --muted:#9CA8BA; --line:#283244;
  --accent:#6E9BFF; --accent-soft:#1D2A44; --good:#4CC98C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121A; --surface:#161D29; --ink:#E6EBF2; --muted:#9CA8BA; --line:#283244;
  --accent:#6E9BFF; --accent-soft:#1D2A44; --good:#4CC98C; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 24px;display:grid;gap:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.bar h1{font-family:var(--display);font-size:18px;margin:0;line-height:1.3}
.bar h1 span{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:8px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.amt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 10px;background:var(--bg);font-size:13px}
.amt input{width:130px;border:0;background:none;font-family:var(--mono);font-weight:600;font-size:14px}
.amt span{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;padding:3px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.fx{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.fx input{width:58px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--mono);font-weight:600;padding:2px 6px;color:var(--accent)}
.row{display:grid;grid-template-columns:190px 104px minmax(0,1fr);gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 18px}
.row.main{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pl b{display:block;font-family:var(--display);font-size:17px;line-height:1.25}
.pl small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.pl .r{font-family:var(--mono);font-weight:600;color:var(--good);font-size:13px;margin-top:4px}
.tag{display:inline-block;font-family:var(--body);font-size:10.5px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:3px}
.donut{position:relative;width:104px;height:104px}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--mono);font-size:12px;font-weight:600}
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px}
.it{display:grid;grid-template-columns:10px minmax(0,1fr) auto 56px;gap:8px;align-items:center;font-size:13.5px;line-height:1.5}
.it i{width:10px;height:10px;border-radius:50%}
.it .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .v{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right}
.it .p{font-family:var(--mono);font-weight:600;text-align:right}
.it.zero{opacity:.45}
.foot{font-size:12px;color:var(--muted);margin:2px 4px 0}
@media (max-width:820px){
  .row{grid-template-columns:104px minmax(0,1fr)}
  .pl{grid-column:1/-1}
  .lg{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="wrap">
  <div class="bar">
    <h1>สัดส่วนเงินลงทุน 5 พอร์ต<span>AF721 · กลุ่มบำรุงร่วง</span></h1>
    <div class="ctl">
      <label class="amt" for="amount"><span>เงินลงทุน ฿</span><input id="amount" type="number" min="0" step="100000" value="100000000" inputmode="numeric"></label>
      <div class="seg" role="group" aria-label="สกุลเงินที่แสดง"><button id="cTHB" aria-pressed="true">THB</button><button id="cUSD" aria-pressed="false">USD</button></div>
      <label class="fx" for="fx">1 USD = <input id="fx" type="number" step="0.01" min="1" value="33.70"> ฿</label>
    </div>
  </div>
  <div id="rows" style="display:grid;gap:10px"></div>
  <p class="foot">น้ำหนักจาก PyPortfolioOpt (ข้อมูลราคา 30 มิ.ย. 2023 – 30 มิ.ย. 2026) · Min Volatility, HRP, Equal Weight และ Thai 60/40 คำนวณจาก 8 สินทรัพย์ที่ Max Sharpe คัดเลือก รวมกับ TLT · HRP ไม่รวม SGOV และ TLT</p>
</div>

<script>
const ASSETS = [
  {id:'LLY',  name:'Eli Lilly',            color:'#2F6FDE'},
  {id:'GOOG', name:'Alphabet',             color:'#1FA2B8'},
  {id:'MS',   name:'Morgan Stanley',       color:'#C2410C'},
  {id:'TSM',  name:'TSMC',                 color:'#E05A8A'},
  {id:'SKH',  name:'SK Hynix',             color:'#23A26D'},
  {id:'MUFG', name:'Mitsubishi UFJ',       color:'#E3A33B'},
  {id:'KBANK',name:'Kasikornbank',         color:'#8B5CF6'},
  {id:'SGOV', name:'iShares 0-3M Treasury',color:'#8A94A3'},
  {id:'TLT',  name:'iShares 20+Y Treasury',color:'#475569'}
];
const PLANS = [
  {label:'Max Sharpe', desc:'Sharpe สูงสุด · คัด 8 ตัว เพดาน 50%', main:true, ret:100.28,
   w:{LLY:10.15,GOOG:10.27,MS:4.41,TSM:6.35,SKH:30.79,MUFG:11.00,KBANK:16.92,SGOV:10.10,TLT:0}},
  {label:'Min Volatility', desc:'ผันผวนต่ำสุด · SGOV+TLT ไม่เกิน 50%', ret:24.17,
   w:{LLY:5.62,GOOG:6.73,MS:6.72,TSM:0.39,SKH:0.83,MUFG:5.39,KBANK:24.32,SGOV:45.15,TLT:4.85}},
  {label:'HRP', desc:'Hierarchical Risk Parity · ไม่รวมพันธบัตร', ret:51.68,
   w:{LLY:12.50,GOOG:10.43,MS:10.86,TSM:6.50,SKH:4.69,MUFG:10.50,KBANK:44.52,SGOV:0,TLT:0}},
  {label:'Equal Weight', desc:'แบ่งเท่ากัน 1/9', ret:60.28,
   w:{LLY:11.1111,GOOG:11.1111,MS:11.1111,TSM:11.1111,SKH:11.1111,MUFG:11.1111,KBANK:11.1111,SGOV:11.1111,TLT:11.1111}},
  {label:'Thai 60/40', desc:'KBank อย่างน้อย 60%', ret:102.29,
   w:{LLY:1.34,GOOG:0,MS:0,TSM:5.06,SKH:33.60,MUFG:0,KBANK:60.00,SGOV:0,TLT:0}}
];
let st={amount:100000000, ccy:'THB', fx:33.70};
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function short(thb){
  const v=st.ccy==='USD'?thb/st.fx:thb, s=st.ccy==='USD'?'$':'฿', a=Math.abs(v);
  if(a>=1e6) return s+fmt(v/1e6,2)+'M';
  if(a>=1e3) return s+fmt(v/1e3,1)+'K';
  return s+fmt(v);
}
function donut(p){
  const r=40,c=2*Math.PI*r; let off=0,s='';
  ASSETS.forEach(a=>{const L=(p.w[a.id]||0)/100*c;
    if(L>0) s+=`<circle r="${r}" cx="52" cy="52" fill="none" stroke="${a.color}" stroke-width="22" stroke-dasharray="${L} ${c-L}" stroke-dashoffset="${-off}" transform="rotate(-90 52 52)"/>`; off+=L;});
  return `<div class="donut"><svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="สัดส่วนพอร์ต ${p.label}">${s}</svg><div class="mid">${short(st.amount)}</div></div>`;
}
function render(){
  $('#cTHB').setAttribute('aria-pressed',st.ccy==='THB');
  $('#cUSD').setAttribute('aria-pressed',st.ccy==='USD');
  $('#rows').innerHTML=PLANS.map(p=>{
    const items=[...ASSETS].sort((x,y)=>(p.w[y.id]||0)-(p.w[x.id]||0)).map(a=>{const w=p.w[a.id]||0;
      return `<div class="it${w?'':' zero'}"><i style="background:${a.color}"></i><span class="n">${a.name}</span><span class="v">${w?short(st.amount*w/100):'–'}</span><span class="p">${w.toFixed(2)}%</span></div>`;}).join('');
    return `<section class="row${p.main?' main':''}"><div class="pl"><b>${p.label}${p.main?'<span class="tag">พอร์ตหลัก</span>':''}</b><small>${p.desc}</small><div class="r">+${p.ret.toFixed(2)}% ต่อปี</div></div>${donut(p)}<div class="lg">${items}</div></section>`;
  }).join('');
}
$('#amount').oninput=e=>{st.amount=Math.max(0,+e.target.value||0);render();};
$('#fx').oninput=e=>{const v=+e.target.value;if(v>0){st.fx=v;render();}};
$('#cTHB').onclick=()=>{st.ccy='THB';render();};
$('#cUSD').onclick=()=>{st.ccy='USD';render();};
render();
</script>

</body></html>
